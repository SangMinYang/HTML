     <script>

        let btnText
        const bulbOFF ="./images/pic_bulboff.gif"
        const bulbON = "./images/pic_bulbon.gif"
        let bulbImg
        
        btn2.addEventListener('click',()=>{ })
        //  자주 사용하는 함수를 변수에 저장
        // const onoff = ()=>{

        // })
        const onoff = function(){}
        if(isOn){ //ON 상태 -isOn 이 true 일떄 실행
            btnText= 'OFF'
            bulbImg = bulbOFF
            }else {//OFF 상태
                btnText = 'ON'
                bulbImg = bulbON
            }
            btn1.textContent = btnText
            img.src = bulbImg
            //isOn 상태를 현재 상태와 반대 (! 연산) 로 변경
            //ture true 이면 false,false이면 true 로 변경
           
            isOn = !isOn

            btn.addEventListener('click',onoff)
            img,addEventListener('click',onoff)
      
     </script>
