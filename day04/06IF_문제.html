<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=bu, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   간단 테스트 버튼  <button id="btn1">ON</button>
    <hr>
    <img src="./images/pic_bulboff.gif" alt="OFF" width="70px"
    style="cursor: pointer;">
    isOn 변수 활용 버튼:<button id="btn2">OFF</button>
    <!-- 버튼 클릭할떄 마다 'ON','OFF' 토굴(toggle) -->
     <script>
        const btn2 = document.getElementById('btn2')
        const img = document.querySelector('img')//태그이름을 선택자 사용
        const btn2 = document .getElementById('btn2')
        // 토글 기능을 변수를 이용해서 제어
        let isOn = false // true('ON'),false('OFF')
        let btnText
        const bulbOFF ="./images/pic_bulboff.gif"
        const bulbON = "./images/pic_bulbon.gif"
        let bulbImg
        
        btn2.addEventListener('click',()=>{

        })
        if(isOn){ //ON 상태 -isOn 이 true 일떄 실행
            btnText= 'OFF'
            bulbImg = bulbOFF
            }else {//OFF 상태
                btnText = 'ON'
                bulbImg = bulbON
            }
            btn2.textContent = btnText
            img.src = bulbImg
            //isOn 상태를 현재 상태와 반대 (! 연산) 로 변경
            //ture true 이면 false,false이면 true 로 변경
           
            isOn = !isOn
        
        const btn1 = document.getElementById('btn1')
        btn1.addEventListner('click',() => {} )
        if(btn1.textContent === 'ON'){
            btn1.textContent = 'OFF'
        }else{
            btn1.textContent = 'ON'
        }

     </script>
</body>
</html>
