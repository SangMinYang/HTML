<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 가입</title>
</head>
<body>
    <h3>회원 가입</h3>
    <hr>
   
    <form action="success.html">
        <table>
            <tr>
                <th><label for="Userid">사용자 아이디</label></th><!-- th 제목이 들어가는 칸-->
                <td>
                    <input type="text"name="Userid" id="Userid" required>
                </td>
            </tr>
             <tr>
                <th><label for="Username">성명</label></th><!-- th 제목이 들어가는 칸-->
                <td>
                    <input type="text"name="username=" id="Username">
                </td>
            </tr>
             <tr>
                <th><label for="password">비밀번호</label></th><!-- th 제목이 들어가는 칸-->
                <td>
                    <input type="password"name="username=" id="password">
                </td>
                <tr>
                    <!-- radio 단일 선태그 같은 그룹의 선택일때 name 속성값을 동일하세!!
                         value 를 꼭 설정해서 선택했을떄 보낼값 을 정하기 -->
                    <td colspan="2">
                <input type="radio" name="age"id="agY" value="yes">
                <label for="">14세 이상</label>
                <input type="radio" name="age" id="agN" value="no">
                <label for="ageN">14세 미만</label>

                    </td>
                    
                    </tr>
                    
                    <tr>
                        <!--checkbox :다중 선택(필수 선택은 아님)-->
                        <td colspan="2">
                        <span>취미를 선택하세요🤳</span>
                        <input type="checkbox" name=" hobby" id="sport" value="운동">
                        <label for="sport">운동</label>
                        <input type="checkbox" name=" hobby" id="sport" value="독서">
                        <label for="red">독서</label>
                        <input type="checkbox" name=" hobby" id="sport" value="노래">
                        <label for="sing">노래</label>
                        <input type="checkbox" name=" hobby" id="sport" value=" 요리">
                        <label for="cookin">요리</label>

                        </td>
                    </tr>
                    
                    <th><label for="거주지역"></label></th>

                    <td><!-- selcet (선택)-->
                        <select name="address" id="">
                        <option value="서울">서울</option> 
                        <option value="경기">경기</option> 
                        <option value="인천">인천</option> 
                        <option value="부산">부산</option> 
                        <option value="강원">강원</option> 
                        </select>
                        
                        

                    </td>
                </tr>
                <tr>
                    <td colspan="2" style=" text-align: center;"></td>
                    <td>
                        <!-- 데이터를 서버로 보내는 버튼은 submit. from 안에는 type 생략가능-->
                        <button>저장</button>
                        <button type="reset">초기화</button>
                        <!--버튼 비활성화 -->
                        <button type="button" disabled>테스트</button>
                        
                    </td>
                    <td>
                        <button type="reset">초기화</button>
                    </td>
                </tr>
            </tr>
        </table>
    </form>
</body>
</html>
